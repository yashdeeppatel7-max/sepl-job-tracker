# Runs the database tests (role rules, sync, payments, PO status, Sheet check) on a throw-away
# Postgres for every change to the database code, before it is merged or applied.
name: Database tests
on:
  pull_request:
    paths: ['supabase/**']
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client >/dev/null
      - name: Run tests
        run: bash supabase/tests/run.sh
