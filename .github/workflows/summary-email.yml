# Morning summary emails, sent from a Gmail account.
#   Daily  (Mon–Sat, about 8:00 AM India time) to the Director and the CEO:
#          what moved since the last report, and what is stuck.
#          Monday's email covers Saturday and Sunday.
#   Weekly (Mondays, about 8:15 AM India time) to the Director only: payments due.
#
# Emails go to the login emails of the Director and CEO (app: More -> Users & roles).
#
# Needs repository secrets:
#   SUPABASE_DB_URL     - already set up for "Apply database changes"
#   GMAIL_USER          - the Gmail address that sends the emails
#   GMAIL_APP_PASSWORD  - a 16-letter app password for that Gmail account
#   MAIL_TO_DIRECTOR, MAIL_TO_CEO - optional, other addresses to use instead
#
# The repository is public: the log never shows the email contents or addresses.
# Run it by hand from Actions -> "Summary emails" -> Run workflow.
name: Summary emails
on:
  schedule:
    - cron: '30 2 * * 1-6'   # 02:30 UTC = 8:00 AM India time, Monday to Saturday
    - cron: '45 2 * * 1'     # 02:45 UTC = 8:15 AM India time, Mondays
  workflow_dispatch:
    inputs:
      summary:
        description: Which summary
        type: choice
        options: [daily, weekly]
        default: daily
      only_director:
        description: Send only to the Director (test)
        type: boolean
        default: true
permissions:
  contents: read
  actions: write   # only to keep the schedule switched on (last step)
concurrency: summary-email
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the summary
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 2 * * 1" ]; then echo "kind=weekly" >> "$GITHUB_OUTPUT"; else echo "kind=daily" >> "$GITHUB_OUTPUT"; fi
            echo "only=false" >> "$GITHUB_OUTPUT"
          else
            echo "kind=${{ inputs.summary }}" >> "$GITHUB_OUTPUT"
            echo "only=${{ inputs.only_director }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the numbers from the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Add the SUPABASE_DB_URL secret"; exit 1; fi
          psql "$DB_URL" -Atq -v ON_ERROR_STOP=1 -f "summaries/${{ steps.pick.outputs.kind }}.sql" > "$RUNNER_TEMP/data.json"
          psql "$DB_URL" -Atq -v ON_ERROR_STOP=1 -f summaries/recipients.sql > "$RUNNER_TEMP/recipients.json"
          echo "Data read ($(wc -c < "$RUNNER_TEMP/data.json") bytes)"

      - name: Install the email library
        run: npm install --no-save --no-audit --no-fund nodemailer@6.9.16 >/dev/null

      - name: Send the email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO_DIRECTOR: ${{ secrets.MAIL_TO_DIRECTOR }}
          MAIL_TO_CEO: ${{ secrets.MAIL_TO_CEO }}
          ONLY_DIRECTOR: ${{ steps.pick.outputs.only }}
        run: node summaries/send.mjs "${{ steps.pick.outputs.kind }}" "$RUNNER_TEMP/data.json" "$RUNNER_TEMP/recipients.json"

      # GitHub switches off schedules in public repos after 60 days without commits.
      - name: Keep the schedule switched on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/summary-email.yml/enable" || true
