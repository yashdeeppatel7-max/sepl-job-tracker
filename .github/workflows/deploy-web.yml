# Builds the web version of the app and publishes it on GitHub Pages.
# Staff open the link on their phone and use "Add to Home Screen".
name: Deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Public values: the publishable key is meant to ship inside the app.
      # Every table is protected by row-level security on the server.
      EXPO_PUBLIC_SUPABASE_URL: https://xcdaaxbjvjljqfzparoj.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_xZlBNUOBN6CAmieZUytksA_5vdDzmvZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist
      - run: cp dist/index.html dist/404.html   # deep links on refresh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
